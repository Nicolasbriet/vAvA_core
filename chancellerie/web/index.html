<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Chancellerie · vAvA</title>
  <link rel="icon" href="img/seal.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript><p class="noscript">La Chancellerie a besoin de JavaScript.</p></noscript>

  <main id="gate" class="gate" hidden>
    <form class="charter" novalidate>
      <span class="charter-seal" aria-hidden="true"></span>
      <h1 class="charter-title">La Chancellerie</h1>
      <p class="charter-subtitle"></p>
      <div class="charter-body"></div>
      <p class="charter-error" role="alert" hidden></p>
      <button type="submit" class="seal-button charter-submit"></button>
    </form>
    <p class="gate-foot"></p>
  </main>

  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <div class="crest">
        <p class="crest-title">La Chancellerie</p>
        <p class="crest-server"></p>
      </div>
      <div class="sidebar-state" role="status" aria-live="polite">
        <span class="state-seal" aria-hidden="true"></span>
        <span class="state-text">
          <span class="state-label"></span>
          <span class="state-detail"></span>
        </span>
      </div>
      <button type="button" class="quick-players-button" data-action="quick-players">
        <span class="quick-players-label"></span>
        <span class="quick-players-count">—</span>
      </button>
      <nav class="nav"></nav>
      <div class="sidebar-foot">
        <span class="account"><span class="seal seal-small" aria-hidden="true"></span><span class="account-name"></span></span>
        <button type="button" class="plain-button" data-action="logout"></button>
      </div>
    </aside>
    <main class="desk">
      <section class="sheet"></section>
    </main>
  </div>

  <div class="dialog" hidden>
    <form class="dialog-card" novalidate>
      <h2 class="dialog-title"></h2>
      <p class="dialog-text"></p>
      <div class="dialog-body"></div>
      <div class="dialog-actions">
        <button type="button" class="ink-button" data-dialog="cancel"></button>
        <button type="submit" class="seal-button" data-dialog="confirm"></button>
      </div>
    </form>
  </div>

  <div class="viewer" role="dialog" aria-labelledby="viewer-title" hidden>
    <div class="viewer-card">
      <header class="viewer-head">
        <h2 id="viewer-title" class="viewer-title"></h2>
        <span class="viewer-status" role="status" aria-live="polite"></span>
      </header>
      <div class="viewer-frame">
        <video class="viewer-video" autoplay muted playsinline></video>
      </div>
      <footer class="viewer-foot">
        <span class="viewer-note"></span>
        <button type="button" class="seal-button" data-action="viewer-close"></button>
      </footer>
    </div>
  </div>

  <div class="slip" role="status" aria-live="polite" hidden></div>

  <script src="js/strings.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ansi.js"></script>
  <script src="js/game.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/view-gate.js"></script>
  <script src="js/view-wizard.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/job.js"></script>
  <script src="js/view-dashboard.js"></script>
  <script src="js/view-performance.js"></script>
  <script src="js/view-console.js"></script>
  <script src="js/view-resources.js"></script>
  <script src="js/view-cfg.js"></script>
  <script src="js/view-schedule.js"></script>
  <script src="js/view-backups.js"></script>
  <script src="js/view-players.js"></script>
  <script src="js/view-realm.js"></script>
  <script src="js/view-zones.js"></script>
  <script src="js/strings-time.js"></script>
  <script src="js/view-time.js"></script>
  <script src="js/view-cameras.js"></script>
  <script src="js/view-accounts.js"></script>
  <script src="js/view-updates.js"></script>
  <script src="js/view-discord.js"></script>
  <script src="js/quick-players.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
