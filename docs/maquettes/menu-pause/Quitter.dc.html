.seg{display:flex;border:1px solid #b39463;border-radius:6px;overflow:hidden}
.seg button{flex:1;height:42px;border:0;border-right:1px solid #c9ad80;background:#f4e8cc;font-size:15px;color:#2b1d12;cursor:pointer}
.seg button:last-child{border-right:0}
.seg .on{background:#2b1d12;color:#f4e8cc;font-weight:600}
