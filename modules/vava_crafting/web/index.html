<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vAvA · Artisanat</title>
  <!--
    web/index.html
    Rôle : les interfaces de l'artisanat : invite près d'une station (touche, nom, type, occupation, combustible), menu
           de station (bandeau, Recettes avec palier choisi par matière et aperçu de qualité, Réparation, Poinçon),
           boîte de baptême d'un chef-d'œuvre, messages. Tous les textes viennent de js/strings.js ; toutes les données du
           jeu (messages du client Lua). Dans un navigateur, web/index.html?view=menu (ou menu&tab=reparation,
           menu&tab=poincon, prompt, name) montre chaque élément avec des données d'exemple (js/devmock.js).
  -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <div class="prompt" id="prompt" hidden>
      <kbd class="prompt-key"></kbd>
      <div class="prompt-body">
        <p class="prompt-line">
          <span class="prompt-verb"></span>
          <span class="prompt-sep">—</span>
          <span class="prompt-label"></span>
          <span class="prompt-type"></span>
        </p>
        <p class="prompt-help" hidden></p>
      </div>
    </div>

    <section class="menu" id="menu" hidden role="dialog" aria-modal="true" aria-labelledby="station-name">
      <header class="station-bar">
        <div class="station-head">
          <h2 class="station-name" id="station-name"></h2>
          <p class="station-meta"></p>
        </div>
        <div class="station-fuel" hidden></div>
        <div class="menu-actions">
          <button type="button" class="menu-refresh"></button>
          <button type="button" class="menu-close" aria-label="Fermer"></button>
        </div>
      </header>
      <nav class="menu-tabs" role="tablist"></nav>
      <div class="menu-pane"></div>
    </section>

    <div class="naming" id="naming" hidden>
      <div class="naming-box" role="dialog" aria-modal="true" aria-labelledby="naming-title">
        <h2 class="naming-title" id="naming-title"></h2>
        <p class="naming-text"></p>
        <input class="naming-input" type="text" autocomplete="off" spellcheck="false">
        <p class="naming-error" hidden></p>
        <div class="naming-foot">
          <span class="naming-remaining"></span>
          <div class="naming-actions">
            <button type="button" class="button button-ghost" data-naming="later"></button>
            <button type="button" class="button button-primary" data-naming="confirm"></button>
          </div>
        </div>
      </div>
    </div>

    <p class="hints" id="hints" hidden></p>
    <div class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="js/strings.js"></script>
  <script src="js/devmock.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/quality.js"></script>
  <script src="js/view-prompt.js"></script>
  <script src="js/view-menu.js"></script>
  <script src="js/view-naming.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
