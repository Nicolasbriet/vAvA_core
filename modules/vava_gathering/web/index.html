<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vAvA · Récolte</title>
  <!--
    web/index.html
    Rôle : les interfaces de la récolte : invite près d'un nœud (touche, geste, ressource, charges, outil à tenir),
           ligne lancée, barre de tension de la pêche, panneau des zones et de leur vitalité, messages. Tous les textes
           viennent de js/strings.js ; toutes les données du jeu (messages du client Lua). Dans un navigateur,
           web/index.html?view=prompt (ou tension, zones) montre chaque élément avec des données d'exemple (dev/devmock.js).
  -->
  <link rel="stylesheet" href="nui://vava_ui/web/css/vava_ui.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <div class="prompt" id="prompt" hidden>
      <kbd class="prompt-key"></kbd>
      <div class="prompt-body">
        <p class="prompt-line">
          <span class="prompt-trial" hidden></span>
          <span class="prompt-verb"></span>
          <span class="prompt-sep">—</span>
          <span class="prompt-label"></span>
          <span class="prompt-charges"></span>
        </p>
        <p class="prompt-help" hidden></p>
      </div>
    </div>

    <div class="cast" id="cast" hidden>
      <span class="cast-bob" aria-hidden="true"></span>
      <div class="cast-body">
        <p class="cast-text"></p>
        <p class="cast-hint"></p>
      </div>
    </div>

    <section class="tension" id="tension" hidden aria-live="polite">
      <header class="tension-head">
        <h2 class="tension-title"></h2>
        <span class="tension-timer"></span>
      </header>
      <div class="tension-track">
        <div class="tension-zone"></div>
        <div class="tension-needle"></div>
      </div>
      <div class="tension-time"><span class="tension-time-fill"></span></div>
      <p class="tension-hint"></p>
      <p class="tension-result" hidden></p>
    </section>

    <section class="zones" id="zones" hidden role="dialog" aria-modal="true" aria-labelledby="zones-title">
      <header class="zones-head">
        <h2 class="zones-title" id="zones-title"></h2>
        <button type="button" class="zones-refresh"></button>
        <button type="button" class="zones-close" aria-label="Fermer"></button>
      </header>
      <div class="zones-list"></div>
      <p class="zones-foot"></p>
    </section>

    <p class="hints" id="hints" hidden></p>
    <div class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="js/strings.js"></script>
  <!-- hors jeu seulement : vava_ui pris dans le dépôt, puis les données simulées (jamais livrées) -->
  <script>typeof GetParentResourceName === 'function' || document.write('<script src="../../vava_ui/web/dev/horsjeu.js"><\/script><script src="dev/devmock.js"><\/script>');</script>
  <script src="js/bridge.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/view-prompt.js"></script>
  <script src="js/view-tension.js"></script>
  <script src="js/view-zones.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
