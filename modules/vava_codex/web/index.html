<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vAvA · Codex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <div class="book">
      <nav class="ribbons" aria-label="Signets"></nav>
      <section class="page page-left">
        <header class="page-head">
          <h1 class="title"></h1>
          <div class="tabs" role="tablist"></div>
        </header>
        <div class="search-wrap">
          <input class="search" type="search" autocomplete="off" spellcheck="false" maxlength="48">
          <span class="search-count"></span>
        </div>
        <div class="index" role="listbox" tabindex="-1"></div>
      </section>
      <div class="spine"></div>
      <section class="page page-right">
        <div class="detail"></div>
        <footer class="settings"></footer>
      </section>
      <nav class="chapters" aria-label="Chapitres"></nav>
    </div>
    <p class="hints"></p>
    <div class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="js/strings.js"></script>
  <script src="js/devmock.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/model.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
