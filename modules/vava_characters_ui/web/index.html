<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vAvA · Personnages</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app" hidden>

    <section id="screen-selection" class="screen selection" hidden>
      <div class="selection-column">
        <header class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <h1 class="brand-title"></h1>
          <p class="brand-subtitle"></p>
          <div class="ornament" aria-hidden="true"></div>
        </header>
        <div class="slots" role="list"></div>
        <p class="slots-counter"></p>
      </div>
    </section>

    <section id="screen-creator" class="screen creator" hidden>
      <aside class="panel" aria-label="Création de personnage">
        <header class="panel-header">
          <div>
            <h1 class="panel-title"></h1>
            <p class="panel-step"></p>
          </div>
          <button type="button" class="icon-button" data-action="cancel"></button>
        </header>
        <div class="panel-main">
          <nav class="rail" role="tablist"></nav>
          <div class="panel-content"></div>
        </div>
        <footer class="panel-footer">
          <button type="button" class="button button-ghost" data-action="previous"></button>
          <button type="button" class="button button-ghost" data-action="next"></button>
          <button type="button" class="button button-primary" data-action="create"></button>
        </footer>
      </aside>
      <div class="viewport">
        <div class="view-switch" role="group">
          <button type="button" class="segment" data-view="face"></button>
          <button type="button" class="segment" data-view="body"></button>
        </div>
        <p class="viewport-hint"></p>
      </div>
    </section>

    <div id="modal" class="modal" hidden>
      <div class="modal-box" role="alertdialog" aria-modal="true">
        <h2 class="modal-title"></h2>
        <p class="modal-message"></p>
        <div class="modal-actions">
          <button type="button" class="button button-ghost" data-modal="cancel"></button>
          <button type="button" class="button button-primary" data-modal="confirm"></button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="js/strings.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/devmock.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/selection.js"></script>
  <script src="js/creator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
