<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vAvA · Livre des compétences</title>
  <!--
    web/index.html
    Rôle : le livre des compétences : un livre de cuir à pages de parchemin, quatre onglets (Compétences, Mentorat,
           Savoirs, Pénurie). Tous les textes viennent de js/strings.js ; toutes les données du serveur (message « open »).
           Dans un navigateur, web/index.html?tab=mentorat (ou competences, savoirs, penurie) montre chaque onglet avec
           des données d'exemple (dev/devmock.js).
  -->
  <link rel="stylesheet" href="nui://vava_ui/web/css/vava_ui.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <section class="book" role="dialog" aria-modal="true" aria-labelledby="book-title">
      <header class="book-header">
        <h1 class="book-title" id="book-title"></h1>
        <nav class="tabs" role="tablist"></nav>
        <button type="button" class="book-close"></button>
      </header>
      <div class="pages"></div>
    </section>
    <p class="hints"></p>
    <div class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="js/strings.js"></script>
  <!-- hors jeu seulement : vava_ui pris dans le dépôt, puis les données simulées (jamais livrées) -->
  <script>typeof GetParentResourceName === 'function' || document.write('<script src="../../vava_ui/web/dev/horsjeu.js"><\/script><script src="dev/devmock.js"><\/script>');</script>
  <script src="js/bridge.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/model.js"></script>
  <script src="js/view-skills.js"></script>
  <script src="js/view-mentoring.js"></script>
  <script src="js/view-knowledge.js"></script>
  <script src="js/view-shortages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
