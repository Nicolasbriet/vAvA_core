<!doctype html>
<!--
  vava_atelier/web/index.html
  Rôle : amorce de la page unique de l'Atelier du Conseil (T-157), livrée à tous : balisage vide et boot.js. La feuille
         et les scripts de la page n'arrivent que chez un membre du Conseil, dans le paquet (directive vava_conseil_web
         du manifeste), et boot.js les insère. Polices et textures prises dans vava_ui ; aucune ressource externe.
         Hors jeu : web/dev/index.html (la page entière, fichiers chargés directement).
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vAvA · Atelier du Conseil</title>
  <link rel="stylesheet" href="nui://vava_ui/web/css/vava_ui.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <div id="veil" class="veil"></div>
    <section id="frame" class="frame" aria-label="L'Atelier du Conseil">
      <div id="sheet" class="sheet"></div>
    </section>
    <aside id="side" class="side" aria-label="Fiche de l'Atelier" hidden>
      <div id="side-sheet" class="sheet"></div>
    </aside>
    <div id="banner" class="banner" hidden></div>
    <div id="keys" class="keys" hidden></div>
    <div id="picker" class="picker" hidden></div>
    <div id="confirm" class="modal" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="boot.js"></script>
</body>
</html>
