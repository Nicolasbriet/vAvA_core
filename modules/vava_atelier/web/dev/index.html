<!doctype html>
<!--
  vava_atelier/web/dev/index.html
  Rôle : page de développement, jamais livrée (dossier dev/) : la page entière de l'Atelier pour l'essayer dans un
         navigateur sans le paquet du Conseil (T-157) ; fichiers chargés directement, données simulées par devmock.js
         (paramètres d'URL : voir son en-tête). Même balisage que ../index.html ; feuille et scripts dans l'ordre de la
         directive vava_conseil_web du manifeste (tenu égal par web/dev/essais.js et atelier_delivery_spec).
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vAvA · Atelier du Conseil (hors jeu)</title>
  <link rel="stylesheet" href="nui://vava_ui/web/css/vava_ui.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <div id="veil" class="veil"></div>
    <section id="frame" class="frame" aria-label="L'Atelier du Conseil">
      <div id="sheet" class="sheet"></div>
    </section>
    <aside id="side" class="side" aria-label="Fiche de l'Atelier" hidden>
      <div id="side-sheet" class="sheet"></div>
    </aside>
    <div id="banner" class="banner" hidden></div>
    <div id="keys" class="keys" hidden></div>
    <div id="picker" class="picker" hidden></div>
    <div id="confirm" class="modal" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="../js/strings.js"></script>
  <!-- vava_ui pris dans le dépôt, puis les données simulées (même place que la ligne hors jeu de la page 1.3.0) -->
  <script src="../../../vava_ui/web/dev/horsjeu.js"></script>
  <script src="devmock.js"></script>
  <script src="../js/bridge.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/lifecycle.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/widgets.js"></script>
  <script src="../js/form.js"></script>
  <script src="../js/placing.js"></script>
  <script src="../js/view-home.js"></script>
  <script src="../js/view-list.js"></script>
  <script src="../js/view-entry.js"></script>
  <script src="../js/view-history.js"></script>
  <script src="../js/view-journal.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
