<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vAvA · La bannière</title>
  <link rel="stylesheet" href="nui://vava_ui/web/css/vava_ui.css">
  <link rel="stylesheet" href="css/pause.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <div class="vignette" aria-hidden="true"></div>

    <!-- La bannière : tringle, tissu, surpiqûres, blason, rubriques -->
    <div class="ban">
      <div class="ban-shadow" aria-hidden="true"></div>
      <div class="ban-cloth" aria-hidden="true"></div>
      <svg class="ban-seams" aria-hidden="true" viewBox="0 0 332 820" preserveAspectRatio="none">
        <path d="M12 26V796L166 744L320 796V26" fill="none" stroke="#dcc08a" stroke-opacity=".38" stroke-width="1.2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
        <path d="M22 26V780L166 732L310 780V26" fill="none" stroke="#dcc08a" stroke-opacity=".16" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <g fill="#b8975f" stroke="#1d140b" stroke-width=".8"><path d="M4 800h16l-3 10h-10z"/><path d="M312 800h16l-3 10h-10z"/></g>
        <g stroke="#b8975f" stroke-width="2"><path d="M8 810v10M12 810v12M16 810v10M20 810v12M316 810v10M320 810v12M324 810v10M328 810v12"/></g>
      </svg>
      <div class="ban-arms" aria-hidden="true">
        <svg viewBox="0 0 100 124">
          <defs><linearGradient id="laiton" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9d3a2"/><stop offset=".45" stop-color="#b8975f"/><stop offset=".46" stop-color="#9a7a48"/><stop offset="1" stop-color="#4e3b21"/></linearGradient></defs>
          <path d="M50 0l50 18v44c0 34-22 52-50 62-28-10-50-28-50-62v-44z" fill="url(#laiton)" stroke="#1d140b" stroke-width="1.2"/>
          <path class="arms-field" d="M50 10l40 14v37c0 27-18 42-40 50-22-8-40-23-40-50v-37z"/>
        </svg>
        <img class="arms-charge" src="img/charges.svg#croix" alt="" draggable="false">
      </div>
      <div class="ban-rod" aria-hidden="true"><span class="ban-knob is-left"></span><span class="ban-knob is-right"></span></div>
      <h1 class="ban-name"></h1>
      <div class="ban-div" aria-hidden="true"></div>
      <nav class="ban-nav"></nav>
      <p class="ban-foot"></p>
      <p class="ban-guild" hidden></p>
    </div>

    <!-- Le panneau de la rubrique : cuir et feuillet clair -->
    <section class="tome" hidden>
      <div class="leaf"></div>
    </section>

    <!-- Plaque du royaume : moment du jour, saison, habitants -->
    <div class="plate" hidden></div>

    <!-- Quitter Eldoria -->
    <div class="veil" hidden></div>
    <section class="tome dialog" role="dialog" aria-modal="true" hidden>
      <div class="leaf"></div>
    </section>

    <p class="status" role="status" aria-live="polite" hidden></p>
  </div>

  <script src="js/strings.js"></script>
  <!-- hors jeu seulement : vava_ui pris dans le dépôt, puis les données simulées (jamais livrées) -->
  <script>typeof GetParentResourceName === 'function' || document.write('<script src="../../vava_ui/web/dev/horsjeu.js"><\/script><script src="dev/devmock.js"><\/script>');</script>
  <script src="js/bridge.js"></script>
  <script src="js/model.js"></script>
  <script src="js/views.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
